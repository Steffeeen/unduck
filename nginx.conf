server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Revalidate HTML, definitions, and assets; do not assume filenames are hashed.
    etag on;
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }

    location = /list {
        try_files /index.html =404;
    }

    location = /list/ {
        try_files /index.html =404;
    }

    location = /bangs/bangs.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Missing definitions and assets must never receive the SPA's HTML.
    location / {
        try_files $uri =404;
    }
}
